<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Generator</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #181c33;
      --card: #1f2450;
      --accent: #6c7cff;
      --accent-2: #8be9fd;
      --text: #e6e9ff;
      --muted: #9aa1ff;
      --crossed: #2a2f6a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1b1f46, var(--bg));
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(12px, 2.5vw, 32px);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      align-items: center;
      gap: 24px;
      max-width: 1480px;
      width: 100%;
      min-width: 0;
    }

    .panel {
      background: linear-gradient(180deg, #1b2050, var(--panel));
      border-radius: 16px;
      padding: clamp(16px, 2vw, 24px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.2rem;
      color: var(--accent-2);
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: #0e1030;
      border: 1px solid #2a2f6a;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      margin-bottom: 12px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    #randomFreeToggleRow {
      max-height: 40px;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(.4,1.5,.5,1),
                  opacity 0.3s,
                  margin-bottom 0.4s;
    }

    .item-warning {
      margin: -4px 0 12px;
      color: #ffe082;
      font-size: 0.85rem;
    }

    .row input[type="checkbox"] {
      accent-color: var(--accent);
      transform: scale(1.2);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #9b7bff);
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px rgba(108,124,255,0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(108,124,255,0.45);
    }

    .board-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .board {
      container-type: inline-size;
      background: linear-gradient(180deg, #262c6d, var(--card));
      border-radius: 24px;
      padding: 28px 28px 32px;
      width: 100%;
      max-width: min(100%, 960px, calc((100dvh - 64px) * 0.93));
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .board-title {
      text-align: center;
      font-size: clamp(0.9rem, 3.85cqw, 2.4rem);
      margin-bottom: 16px;
      color: var(--accent-2);
      text-shadow: 0 0 12px rgba(139,233,253,0.35);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      container-type: inline-size;
    }

    .cell {
      background: #10144a;
      border: 1px solid #343a80;
      border-radius: clamp(8px, 2.1cqw, 14px);
      padding: clamp(4px, 1.8cqw, 12px);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      position: relative;

      height: auto;
      aspect-ratio: 1 / 1;

      font-size: clamp(0.62rem, 2.75cqw, 2rem);
      line-height: 1.15;
      word-break: break-word;
      overflow: hidden;

      transition: background 0.2s ease,
                  transform 0.15s ease,
                  box-shadow 0.15s ease;
    }

    .cell:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }

    .cell.crossed {
      background: linear-gradient(135deg, #3a3f8f, #23276b);
      color: #ffffff;
      text-decoration: line-through;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.15), 0 0 18px rgba(139,233,253,0.35);
      animation: stamp 0.35s cubic-bezier(.2,1.4,.4,1);
    }

    .cell:not(.crossed) {
      z-index: 10;
    }

    .cell.crossed::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 18px;
      animation: ripple 1s ease-out;
    }

    .cell.crossed::after {
      content: "✕";
      position: absolute;
      font-size: clamp(1.25rem, 8cqw, 3rem);
      opacity: 0.35;
    }

    .cell.free {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: #032e12;
      font-weight: bold;
      cursor: default;
    }

    @media (max-width: 900px) {
      body {
        align-items: flex-start;
      }

      .app {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .board-container {
        order: -1;
      }

      .board {
        max-width: min(100%, 76vw, calc(100dvh - 24px));
        padding: clamp(12px, 3.9cqw, 28px);
        border-radius: clamp(16px, 3.3cqw, 24px);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .app {
        gap: 14px;
      }

      .board {
        padding: 10px;
        border-radius: 16px;
        max-width: 100%;
      }

      .grid {
        gap: 4px;
      }

      .cell {
        padding: clamp(3px, 1.2cqw, 6px);
        border-radius: clamp(6px, 2.2cqw, 8px);
      }

      .panel {
        padding: 16px;
      }
    }

    @media (max-height: 700px) and (min-width: 901px) {
      .app {
        height: calc(100dvh - 2 * clamp(12px, 2.5vw, 32px));
      }

      .panel {
        min-height: 0;
        max-height: 100%;
        overflow-y: auto;
      }

      .board {
        max-width: min(100%, calc((100dvh - 64px) * 0.93));
        padding: 12px;
      }

      .board-title {
        margin-bottom: 8px;
      }

      .grid {
        gap: 5px;
      }
    }
    
    .bingo-line {
        background: linear-gradient(135deg, #ffeb3b 60%, #ffe082 100%) !important;
        color: #222 !important;
        text-shadow: 0 0 8px #fffde4;
        font-weight: bold;
        animation: bingoFlash 0.7s;
    }
    
    @keyframes bingoFlash {
        0% { box-shadow: 0 0 0 0 #ffe082; }
        50% { box-shadow: 0 0 24px 8px #ffe082; }
        100% { box-shadow: 0 0 0 0 #ffe082; }
    }
    
    .bingo-animate {
      animation: bingoTitlePop 1.2s cubic-bezier(.2,1.5,.5,1);
      color: #ffe082 !important;
      text-shadow: 0 0 24px #ffe082, 0 0 8px #fffde4;
    }
    
    .bingo-combo {
      animation: bingoComboPop 1.6s cubic-bezier(.2,1.5,.5,1);
      color: #ff4081 !important;
      text-shadow: 0 0 32px #ff4081, 0 0 16px #fffde4, 0 0 8px #ffe082;
      letter-spacing: 2px;
    }
    
    @keyframes bingoTitlePop {
      0% { transform: scale(1); }
      20% { transform: scale(1.18) rotate(-2deg); }
      40% { transform: scale(1.12) rotate(2deg); }
      60% { transform: scale(1.2) rotate(-1deg); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    @keyframes bingoComboPop {
      0% { transform: scale(1) rotate(0deg); }
      10% { transform: scale(1.25) rotate(-6deg); }
      20% { transform: scale(1.18) rotate(6deg); }
      30% { transform: scale(1.3) rotate(-8deg); }
      40% { transform: scale(1.22) rotate(8deg); }
      60% { transform: scale(1.4) rotate(0deg); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1) rotate(0deg); }
    }
    
    .grid { aspect-ratio: 1/1; }
    .cell { min-width: 0; word-break: break-word; }

    @keyframes boardShake {
        0%   { transform: translate(0, 0) rotate(0deg); }
        15%  { transform: translate(-6px, 2px) rotate(-1deg); }
        30%  { transform: translate(6px, -2px) rotate(1deg); }
        45%  { transform: translate(-4px, 2px) rotate(-0.5deg); }
        60%  { transform: translate(4px, -2px) rotate(0.5deg); }
        75%  { transform: translate(-2px, 1px); }
        100% { transform: translate(0, 0); }
    }

    @keyframes ripple {
      from { opacity: 0.8; transform: scale(0.6); }
      to   { opacity: 0; transform: scale(1.4); }
    }

    @keyframes stamp {
      0%   { z-index: 100; transform: scale(1); }
      40%  { z-index: 100; transform: scale(1.25) rotate(-3deg); }
      70%  { z-index: 100; transform: scale(0.95); }
      100% { z-index: 100; transform: scale(1); }
    }

    .board.shake {
        animation: boardShake 0.45s ease;
    }

    .cell.bingo-line {
      animation: breathe 6s ease-in-out infinite;
    }

    .cell.bingo-jump {
      animation: cellJump 0.65s cubic-bezier(.2,1.5,.5,1);
      z-index: 20;
    }

    @keyframes cellJump {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-18px) scale(1.12); }
      70% { transform: translateY(2px) scale(0.96); }
    }

    @keyframes breathe {
      0%,100% { box-shadow: 0 30px 60px rgba(0,0,0,.4); }
      50% { box-shadow: 0 40px 70px rgba(108,124,255,.35); }
    }

    .cell.almost {
      animation: almostPulse 1.4s ease-in-out infinite;
      box-shadow: 0 0 22px rgba(255, 235, 130, 0.55);
    }

    @keyframes almostPulse {
      0%, 100% {
        box-shadow: 0 0 0 rgba(255, 235, 130, 0);
      }
      50% {
        box-shadow: 0 0 22px rgba(255, 235, 130, 0.75);
      }
    }
</style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <h2>Setup</h2>

      <label for="titleInput">Bingo Title</label>
      <input id="titleInput" type="text" placeholder="My Awesome Bingo" />

      <label for="itemsInput">Bingo Entries (one per line) <span id="itemsCount" style="color:var(--muted);font-weight:normal;font-size:0.95em;"></span></label>
      <textarea id="itemsInput" placeholder="Thing #1\nThing #2\nThing #3"></textarea>
      <div id="itemWarning" class="item-warning" role="status" aria-live="polite" hidden></div>

      <div class="row" id="freeToggleRow">
        <input id="freeToggle" type="checkbox" checked />
        <label for="freeToggle">Enable free space</label>
      </div>

      <div class="row" id="randomFreeToggleRow">
        <input id="randomFreeToggle" type="checkbox" />
        <label for="randomFreeToggle">Random free space location</label>
      </div>

      <input type="text" id="freeTextInput" placeholder="Custom free space text" style="width:100%; margin-bottom:12px;" />

      <button id="generateBtn">Generate / Re-generate</button>
      <button id="exportBtn" style="margin-top:10px;">Export Current Board
      </button>
      <button id="exportSettingsBtn" style="margin-top:10px;">Export Current Settings</button>
    </div>

    <div class="board-container">
      <div class="board" id="board">
        <div class="board-title" id="boardTitle">BINGO</div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>

  <script>
    const titleInput = document.getElementById('titleInput');
    const itemsInput = document.getElementById('itemsInput');
    const freeToggle = document.getElementById('freeToggle');
    const generateBtn = document.getElementById('generateBtn');
    const grid = document.getElementById('grid');
    const boardTitle = document.getElementById('boardTitle');
    const exportBtn = document.getElementById('exportBtn');
    const freeTextInput = document.getElementById('freeTextInput');
    const itemWarning = document.getElementById('itemWarning');
    const freeToggleRow = document.getElementById('freeToggleRow');
    const randomFreeToggle = document.getElementById('randomFreeToggle');
    const randomFreeToggleRow = document.getElementById('randomFreeToggleRow');

    function getBingoItems() {
      return itemsInput.value
        .split('\n')
        .map(v => {
          v = v.trim();
          if (v.length > 0 && [',', ';', '|', '/'].includes(v[v.length - 1])) {
            v = v.slice(0, -1).trim();
          }
          return v;
        })
        .filter(v => v.length > 0);
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getBingoParams(order) {
      const title = titleInput.value.trim() || 'BINGO';
      let items = itemsInput.value
        .split('\n')
        .map(v => v.trim())
        .filter(v => v.length > 0);
      const useFree = freeToggle.checked;
      const totalCells = useFree ? 24 : 25;
      items = items.slice(0, totalCells);
      const params = new URLSearchParams();
      params.set('title', title);
      params.set('free', useFree ? '1' : '0');
      params.set('items', items.join('|'));
      if (order)
        params.set('order', order.join(','));
      return params;
    }

    // Track which lines have already been bingo'd for combo animation
    let prevBingoLines = new Set();
    let lastOrder = null;
    let lastCellData = null;
    let lastFreeText = '';
    let lastFreeIndex = 12;

    function generateBoard(fromParams = false, importedOrder = null, importedCells = null, importedFree = null, importedFreeIndex = null) {
      updateItemsCount();
      const title = titleInput.value.trim() || 'BINGO';
      boardTitle.textContent = title;
      document.title = title + ' – Bingo';

      let items = getBingoItems();

      // Force free space ON and disable toggle if not enough entries
      if (items.length < 25) {
        freeToggle.checked = true;
        freeToggle.disabled = true;
        freeToggleRow.title = 'Free space is locked because the board needs 25 entries when free space is disabled.';
        updateFreeTextInputVisibility();
      } else {
        freeToggle.disabled = false;
        freeToggleRow.removeAttribute('title');
      }

      updateRandomFreeToggleAvailability();
      const useFree = freeToggle.checked;
      const totalCells = useFree ? 24 : 25;
      items = items.slice(0, totalCells);
      updateItemsCount();
      const freeIndex = useFree
        ? (Number.isInteger(importedFreeIndex) && importedFreeIndex >= 0 && importedFreeIndex < 25
          ? importedFreeIndex
          : randomFreeToggle.checked ? Math.floor(Math.random() * 25) : 12)
        : -1;
      let orderArr;
      let cellData;
      let freeText = freeTextInput.value.trim();
      if (fromParams && importedCells && importedCells.length === 25) {
        // Use imported cell data
        cellData = importedCells.slice();
        orderArr = importedOrder || Array.from({length: items.length}, (_, i) => i);
        freeText = importedFree || '';
      } else if (fromParams && importedCells && importedCells.length < 25) {
        // If importedCells is less than 25, pad with empty strings to avoid crash
        cellData = importedCells.slice();
        while (cellData.length < 25) cellData.push('');
        orderArr = importedOrder || Array.from({length: items.length}, (_, i) => i);
        freeText = importedFree || '';
      } else {
        // Shuffle and save order
        orderArr = Array.from({length: items.length}, (_, i) => i);
        if (!fromParams) shuffle(orderArr);
        cellData = [];
        let itemIdx = 0;
        for (let i = 0; i < 25; i++) {
          if (useFree && i === freeIndex) {
            // Free space logic
            cellData.push(freeText || 'FREE');
          } else {
            // Fill each non-free cell with the next item.
            let idx = orderArr[itemIdx];
            cellData.push(items[idx] || '');
            itemIdx++;
          }
        }
      }
      lastOrder = orderArr;
      lastCellData = cellData;
      lastFreeText = freeText;
      lastFreeIndex = freeIndex;
      prevBingoLines = new Set();

      grid.innerHTML = '';
      const cells = [];

      function checkBingo() {
        // 5x5 grid, check rows, columns, diagonals
        const crossed = cells.map(cell => cell.classList.contains('crossed'));
        const lines = [];
        // Rows
        for (let r = 0; r < 5; r++) lines.push([0,1,2,3,4].map(c => r*5+c));
        // Columns
        for (let c = 0; c < 5; c++) lines.push([0,1,2,3,4].map(r => r*5+c));
        // Diagonals
        lines.push([0,6,12,18,24]);
        lines.push([4,8,12,16,20]);
        
        const completedLines = new Set();
        const newlyCompletedLines = new Set();

        cells.forEach(cell => cell.classList.remove('bingo-line', 'almost'));
        lines.forEach((line, lineIndex) => {
          const crossedCount = line.filter(index => crossed[index]).length;
          if (crossedCount === 5) {
            completedLines.add(lineIndex);
            line.forEach(index => cells[index].classList.add('bingo-line'));
            if (!prevBingoLines.has(lineIndex)) {
              newlyCompletedLines.add(lineIndex);
            }
          } else if (crossedCount === 4) {
            line.forEach(index => {
              if (!crossed[index]) cells[index].classList.add('almost');
            });
          }
        });

        prevBingoLines = completedLines;
        if (newlyCompletedLines.size > 0) {
          const jumpCells = new Set();
          newlyCompletedLines.forEach(lineIndex => {
            lines[lineIndex].forEach(index => jumpCells.add(index));
          });
          jumpCells.forEach(index => {
            const cell = cells[index];
            cell.classList.remove('bingo-jump');
            void cell.offsetWidth;
            cell.classList.add('bingo-jump');
            cell.addEventListener('animationend', () => cell.classList.remove('bingo-jump'), { once: true });
          });

          // Play happy animation, crazier for more lines
          boardTitle.classList.remove('bingo-animate', 'bingo-combo');
          void boardTitle.offsetWidth;
          if (newlyCompletedLines.size === 1) {
            boardTitle.classList.add('bingo-animate');
            setTimeout(() => boardTitle.classList.remove('bingo-animate'), 1200);
          } else {
            boardTitle.classList.add('bingo-combo');
            setTimeout(() => boardTitle.classList.remove('bingo-combo'), 1600);
          }
          launchConfetti(completedLines.size);
        }
      }

      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = cellData[i] || '';
        cells.push(cell);
        if (useFree && i === freeIndex && (freeText || cellData[i] === 'FREE')) {
          cell.classList.add('free');
        }
        cell.addEventListener('click', () => {
          cell.classList.toggle('crossed');
          checkBingo();
        });
        grid.appendChild(cell);
      }
    }
    // Add bingo-line and bingo-animate styles

    generateBtn.addEventListener('click', () => {
        const board = document.getElementById('board');
        board.classList.remove('shake');
        void board.offsetWidth; // force reflow
        board.classList.add('shake');

        generateBoard(false);
    });

    const itemsCount = document.getElementById('itemsCount');
    function updateItemsCount() {
      const count = getBingoItems().length;
      itemsCount.textContent = `(${count} option${count === 1 ? '' : 's'})`;
      const requiredCount = count < 25 || freeToggle.checked ? 24 : 25;
      const missing = Math.max(0, requiredCount - count);
      itemWarning.textContent = missing
        ? `Add ${missing} more non-blank item${missing === 1 ? '' : 's'} to fill the board.`
        : '';
      itemWarning.hidden = missing === 0;
    }
    itemsInput.addEventListener('input', updateItemsCount);
    

    // Unified loader: only set demo content if not loading from params
    let loadedFromParams = false;
    function tryLoadFromParams() {
      const params = new URLSearchParams(window.location.search);
      if (!params.has('items')) return false;
      const title = params.get('title') || 'BINGO';
      const useFree = params.get('free') === '1';
      const items = params.get('items').split('|');
      const randomFree = params.get('randomFree') === '1';
      let order = null;
      if (params.has('order')) order = params.get('order').split(',').map(Number);
      let cells = null;
      if (params.has('cells')) cells = params.get('cells').split('|').map(decodeURIComponent);
      let freetext = params.get('freetext') || '';
      const freeIndex = params.has('freeIndex') ? Number(params.get('freeIndex')) : null;
      titleInput.value = title;
      freeToggle.checked = useFree;
      randomFreeToggle.checked = randomFree;
      itemsInput.value = items.join('\n');
      freeTextInput.value = freetext;
      generateBoard(true, order, cells, freetext, freeIndex);
      window.history.replaceState({}, document.title, window.location.pathname);
      
      return true;
    }

    loadedFromParams = tryLoadFromParams();


    exportBtn.addEventListener('click', () => {
      // Export the actual cell data and free text, not just the input list (fixed board)
      const params = new URLSearchParams();
      params.set('title', titleInput.value.trim() || 'BINGO');
      params.set('free', freeToggle.checked ? '1' : '0');
      params.set('randomFree', randomFreeToggle.checked ? '1' : '0');
      params.set('items', itemsInput.value
        .split('\n')
        .map(v => v.trim())
        .filter(v => v.length > 0)
        .join('|'));
      params.set('cells', lastCellData ? lastCellData.map(x => encodeURIComponent(x)).join('|') : '');
      params.set('order', lastOrder ? lastOrder.join(',') : '');
      params.set('freetext', lastFreeText || '');
      if (freeToggle.checked) params.set('freeIndex', String(lastFreeIndex));
      const url = window.location.origin + window.location.pathname + '?' + params.toString();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          exportBtn.textContent = 'Copied!';
          setTimeout(() => { exportBtn.textContent = 'Export Shareable URL'; }, 1200);
        }, () => {
          window.prompt('Copy this URL:', url);
        });
      } else {
        window.prompt('Copy this URL:', url);
      }
    });

    // Export settings only (for same setup, not same board)
    const exportSettingsBtn = document.getElementById('exportSettingsBtn');
    exportSettingsBtn.addEventListener('click', () => {
      const params = new URLSearchParams();
      params.set('title', titleInput.value.trim() || 'BINGO');
      params.set('free', freeToggle.checked ? '1' : '0');
      params.set('randomFree', randomFreeToggle.checked ? '1' : '0');
      params.set('items', itemsInput.value
        .split('\n')
        .map(v => v.trim())
        .filter(v => v.length > 0)
        .join('|'));
      params.set('freetext', freeTextInput.value.trim() || '');
      // Do NOT include 'cells' or 'order' (so board is randomized)
      const url = window.location.origin + window.location.pathname + '?' + params.toString();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          exportSettingsBtn.textContent = 'Copied!';
          setTimeout(() => { exportSettingsBtn.textContent = 'Export Settings URL'; }, 1200);
        }, () => {
          window.prompt('Copy this URL:', url);
        });
      } else {
        window.prompt('Copy this URL:', url);
      }
    });

    if (!loadedFromParams) {
      // Initial demo content
      itemsInput.value = [
        'Free parking space',
        'Unexpected bug',
        'Someone says “it works on my machine”',
        'Late meeting start',
        'Coffee refill',
        'Random reboot',
        'Docs are outdated',
        'Hotfix on Friday',
        'Forgotten password',
        'DNS issue',
        'Cache problem',
        'Blame the network',
        'Blame the user',
        'Works after restart',
        'Missing semicolon',
        'Merge conflict',
        'Commented-out code',
        'TODO left forever',
        'Test passes locally',
        'Build fails in CI',
        'One more quick change',
        'Scope creep',
        'Last-minute request',
        'Version mismatch',
        'Deprecated API'
      ].join('\n');
      generateBoard();
    }

    // Confetti effect
    function launchConfetti(activeBingos) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const old = document.getElementById('bingo-confetti');
      if (old) old.remove();

      const canvas = document.createElement('canvas');
      canvas.id = 'bingo-confetti';
      canvas.style.position = 'fixed';
      canvas.style.left = 0;
      canvas.style.top = 0;
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = 9999;
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      if (!ctx) {
        canvas.remove();
        return;
      }

      const colors = ['#ffe082', '#ff6b9a', '#8be9fd', '#9b8cff', '#65e6a5', '#fff4cf'];
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const resizeCanvas = () => {
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      resizeCanvas();

      const boardRect = document.getElementById('board').getBoundingClientRect();
      const titleRect = document.getElementById('boardTitle').getBoundingClientRect();
      const titleCenterX = titleRect.left + titleRect.width / 2;
      const titleCenterY = titleRect.top + titleRect.height / 2;
      const multiplier = Math.max(1, activeBingos);
      const burstCount = Math.min(6, 1 + Math.ceil(multiplier / 2));
      const particleCount = Math.min(720, 90 * multiplier);
      const particles = [];
      const bursts = [];

      for (let burst = 0; burst < burstCount; burst++) {
        const spread = burstCount === 1 ? 0 : (burst / (burstCount - 1) - 0.5) * Math.min(boardRect.width * 0.52, 340);
        const x = Math.max(24, Math.min(window.innerWidth - 24, titleCenterX + spread));
        const y = Math.max(24, Math.min(window.innerHeight - 24, titleCenterY));
        bursts.push({ x, y, start: burst * 0.07 });
      }

      bursts.forEach((burst, burstIndex) => {
        const count = Math.ceil(particleCount / burstCount);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.16;
          const speed = 190 + Math.random() * 330;
          particles.push({
            x: burst.x,
            y: burst.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 35,
            gravity: 420 + Math.random() * 260,
            drag: 0.985 + Math.random() * 0.01,
            size: 7 + Math.random() * 8,
            rotation: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 11,
            flutter: Math.random() * Math.PI * 2,
            flutterSpeed: 5 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            shape: Math.random() < 0.16 ? 'circle' : 'ribbon',
            delay: burst.start + Math.random() * 0.08,
            life: 1.5 + Math.random() * 0.9,
            age: 0,
          });
        }
      });

      let previousTime = 0;
      let startTime = 0;
      function drawParticle(particle) {
        const fade = Math.min(1, (particle.life - particle.age) / 0.45);
        const flutter = Math.sin(particle.flutter) * 0.4;
        const rotation = particle.rotation + flutter;
        const cos = particle.shape === 'circle' ? 1 : Math.cos(rotation);
        const sin = particle.shape === 'circle' ? 0 : Math.sin(rotation);
        ctx.setTransform(
          dpr * cos, dpr * sin,
          -dpr * sin, dpr * cos,
          dpr * particle.x, dpr * particle.y
        );
        ctx.globalAlpha = Math.max(0, fade) * 0.92;
        ctx.fillStyle = particle.color;
        if (particle.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, particle.size * 0.42, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const width = particle.size * (0.62 + Math.abs(flutter) * 0.55);
          ctx.fillRect(-width / 2, -particle.size * 0.7, width, particle.size * 1.4);
        }
      }

      function animate(now) {
        if (!canvas.isConnected) return;
        if (!startTime) startTime = now;
        if (!previousTime) previousTime = now;
        const delta = Math.min((now - previousTime) / 1000, 0.032);
        previousTime = now;
        const elapsed = (now - startTime) / 1000;
        ctx.globalAlpha = 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        bursts.forEach(burst => {
          const age = elapsed - burst.start;
          if (age >= 0 && age < 0.8) {
            const progress = age / 0.8;
            ctx.beginPath();
            ctx.arc(burst.x, burst.y, 12 + progress * 56, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 224, 130, ${0.42 * (1 - progress)})`;
            ctx.lineWidth = 3 * (1 - progress) + 0.5;
            ctx.stroke();
          }
        });

        particles.forEach(particle => {
          if (elapsed < particle.delay) return;
          particle.age += delta;
          if (particle.age >= particle.life) return;
          particle.vx *= particle.drag;
          particle.vy += particle.gravity * delta;
          particle.x += particle.vx * delta;
          particle.y += particle.vy * delta;
          particle.rotation += particle.spin * delta;
          particle.flutter += particle.flutterSpeed * delta;
          drawParticle(particle);
        });

        if (particles.some(particle => particle.age < particle.life)) {
          requestAnimationFrame(animate);
        } else {
          canvas.remove();
        }
      }

      requestAnimationFrame(animate);
    }

    // Add sliding animation for freeTextInput
    const freeTextInputEl = document.getElementById('freeTextInput');
    freeTextInputEl.style.transition = 'max-height 0.4s cubic-bezier(.4,1.5,.5,1), opacity 0.3s';
    freeTextInputEl.style.overflow = 'hidden';
    freeTextInput.style.maxHeight = freeToggle.checked ? '60px' : '0';
    freeTextInput.style.opacity = freeToggle.checked ? '1' : '0';

    function updateFreeTextInputVisibility() {
      if (freeToggle.checked) {
        freeTextInput.style.maxHeight = '60px';
        freeTextInput.style.opacity = '1';
      } else {
        freeTextInput.style.maxHeight = '0';
        freeTextInput.style.opacity = '0';
      }
    }

    function updateRandomFreeToggleAvailability() {
      randomFreeToggle.disabled = !freeToggle.checked;
      randomFreeToggleRow.title = freeToggle.checked
        ? ''
        : 'Enable free space to choose a random location.';
      randomFreeToggleRow.style.maxHeight = freeToggle.checked ? '40px' : '0';
      randomFreeToggleRow.style.opacity = freeToggle.checked ? '1' : '0';
      randomFreeToggleRow.style.marginBottom = freeToggle.checked ? '12px' : '0';
    }

    freeToggle.addEventListener('change', () => {
      // Only allow user to change if not disabled
      if (!freeToggle.disabled) {
        updateFreeTextInputVisibility();
        updateRandomFreeToggleAvailability();
        updateItemsCount();
      } else {
        // Revert any user attempt to change when disabled
        freeToggle.checked = true;
      }
    });

    freeTextInputEl.addEventListener('blur', () => {
        if (freeToggle.checked && freeTextInputEl.value.trim() === '') {
            freeTextInputEl.value = 'FREE';
            updateCenterFreeCell('FREE');
        }
        });

        freeTextInputEl.addEventListener('input', () => {
        if (!freeToggle.checked) return;
        const val = freeTextInputEl.value.trim();
        updateCenterFreeCell(val || 'FREE');
        });

        function updateCenterFreeCell(text) {
        const gridCells = document.querySelectorAll('.grid .cell');
        if (gridCells.length === 25) {
            const freeCell = gridCells[lastFreeIndex];
            if (freeCell && freeToggle.checked) {
              freeCell.textContent = text;
              freeCell.classList.add('free');
            }
        }
    }

    // Update only the title instantly
    const boardTitleEl = document.getElementById('boardTitle');
    titleInput.addEventListener('input', () => {
      boardTitleEl.textContent = titleInput.value.trim() || 'BINGO';
      document.title = (titleInput.value.trim() || 'BINGO') + ' – Bingo';
    });
  </script>
</body>
</html>
